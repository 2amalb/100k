<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EGOX">
<title>EGOX Локации 100k</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 3 screens (Сводка · Локации · Выезды). Summary answers "сколько закрыли и что искать"; lists are cards that open one simple form. Single dark EGOX look. */
:root{
  --bg:#0A0A0A; --panel:#131312; --panel2:#1C1C1B; --line:#2A2A28; --fg:#F5F5F2; --mut:#9A9A96; --dim:#62625E;
  --ok:#4FB37A; --okbg:rgba(79,179,122,.14); --warn:#E8A33A; --warnbg:rgba(232,163,58,.13); --bad:#E5604D; --badbg:rgba(229,96,77,.14);
  --info:#7FA7D9; --infobg:rgba(127,167,217,.14);
  --f-ui:'Jost','Avenir Next','Segoe UI',system-ui,sans-serif; --f-num:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;padding-block:12px;flex-wrap:wrap}
.logo{height:20px;width:auto;display:block}
nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto}
nav button{background:none;border:0;color:var(--mut);font:500 15px var(--f-ui);padding:8px 12px;border-radius:6px;cursor:pointer;display:flex;gap:6px;align-items:center}
nav button[aria-current="true"]{color:var(--fg);background:var(--panel2)}
nav .cnt{font:500 11px var(--f-num);background:var(--badbg);color:var(--bad);border-radius:999px;padding:1px 6px}
.acts{display:flex;gap:8px}
.btn{background:var(--fg);color:var(--bg);border:0;font:600 14px var(--f-ui);padding:9px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
:is(button,input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid var(--info);outline-offset:2px}
main{padding-block:26px 64px;display:flex;flex-direction:column;gap:34px}
h1{font:500 28px/1.2 var(--f-ui);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font:500 18px/1.3 var(--f-ui);margin:0;text-wrap:balance}
p{margin:0}
.mut{color:var(--mut)} .small{font-size:13px} .num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font:500 11px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.sec{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.big{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.big .v{font:500 44px/1 var(--f-num);letter-spacing:-.02em}
.big .v small{font-size:18px;color:var(--mut)}
.need{background:var(--fg);color:var(--bg);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:8px;justify-content:space-between}
.need .v{font:500 44px/1 var(--f-num)}
.need .mut{color:#55554F}
.stack{height:10px;border-radius:5px;background:var(--panel2);display:flex;overflow:hidden}
.stack i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:var(--c)}
/* category rows */
.rows{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.crow{border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow>summary{list-style:none;display:grid;grid-template-columns:34px minmax(0,1.3fr) minmax(0,1fr) 110px 18px;gap:14px;align-items:center;padding:14px 16px;cursor:pointer}
.crow>summary::-webkit-details-marker{display:none}
.crow>summary:hover{background:var(--panel)}
.crow[open]>summary{background:var(--panel)}
.cid{font:500 12px var(--f-num);color:var(--mut)}
.cname{font-weight:500}
.mini{height:6px;background:var(--panel2);border-radius:3px;display:flex;overflow:hidden}
.mini i{display:block;height:100%}
.cneed{text-align:right}
.cneed b{font:500 20px var(--f-num);display:block;line-height:1.1}
.chev{color:var(--mut);transition:transform .2s}
.crow[open] .chev{transform:rotate(90deg)}
.cbody{padding:4px 16px 16px;background:var(--panel);display:flex;flex-direction:column;gap:12px}
/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:500 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.en{display:block;font-size:12px;color:var(--dim)}
.tag{font:500 11px var(--f-ui);letter-spacing:.04em;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.tag.out{color:var(--info);border-color:rgba(127,167,217,.35)}
/* meters */
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.meter .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.track{position:relative;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0}
/* grow list + cards */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left;cursor:pointer;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--panel)}
.item .t{font-weight:500}
.item .meta{font-size:13px;color:var(--mut);display:flex;gap:6px 12px;flex-wrap:wrap;margin-top:3px}
.item .side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.vitem{grid-template-columns:minmax(0,1fr)}
.vitem .side{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start}
.gain{font:500 15px var(--f-num);color:var(--warn)}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--pb);color:var(--pc)}
.s-ok{--pb:var(--okbg);--pc:var(--ok)}.s-warn{--pb:var(--warnbg);--pc:var(--warn)}.s-bad{--pb:var(--badbg);--pc:var(--bad)}.s-info{--pb:var(--infobg);--pc:var(--info)}.s-dim{--pb:var(--panel2);--pc:var(--mut)}
.flag{color:var(--bad);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--mut);font:500 13px var(--f-ui);padding:6px 11px;border-radius:999px;cursor:pointer;display:flex;gap:6px;align-items:center}
.chip b{font:500 12px var(--f-num);color:inherit}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:var(--panel);border:1px solid var(--line);color:var(--fg);font:400 15px var(--f-ui);padding:10px 12px;border-radius:6px;min-width:0;width:100%}
.filters input,.filters select{width:auto;flex:1 1 180px}
textarea{resize:vertical;min-height:64px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut);min-width:0}
.res{display:flex;gap:6px;flex-wrap:wrap}
.res button{background:var(--panel);border:1px solid var(--line);color:var(--fg);font:500 13px var(--f-ui);padding:6px 10px;border-radius:6px;cursor:pointer}
.res button:hover{border-color:var(--dim)}
.empty{color:var(--mut);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:10px}
/* rules */
details.box{border:1px solid var(--line);border-radius:10px}
details.box>summary{padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center;list-style:none}
details.box>summary::-webkit-details-marker{display:none}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:0 16px 14px}
.check{background:var(--panel);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px}
.rules{list-style:none;margin:0;padding:0 16px 16px}
.rules li{padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px}
.rules small{display:block;color:var(--mut);font-size:13px}
/* drawer form */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:50;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:18px}
.form{display:flex;flex-direction:column;gap:18px}
.step{display:flex;flex-direction:column;gap:10px}
.step>.eyebrow{display:flex;gap:8px;align-items:center}
.step>.eyebrow i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--panel2);color:var(--fg);display:inline-grid;place-items:center;font:500 11px var(--f-num)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{font-size:14px;color:var(--mut);display:flex;gap:6px 14px;flex-wrap:wrap}
.calc b{color:var(--fg);font-family:var(--f-num);font-weight:500}
.more>summary{cursor:pointer;color:var(--mut);font-size:14px}
.more[open]>summary{margin-bottom:10px}
.footer{display:flex;gap:10px;position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:12px;border-top:1px solid var(--line)}
.hero1{display:flex;flex-direction:column;gap:14px}
.hv{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hv .num{font:500 56px/1 var(--f-num);letter-spacing:-.03em}
.hv .of{color:var(--mut);font-size:16px}
.big8{height:12px;border-radius:6px}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sz{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:6px;color:var(--mut)}
.sz .v{font:500 40px/1 var(--f-num);color:var(--fg)}
.sz.lead{background:var(--fg);border-color:var(--fg);color:#55554F}.sz.lead .v{color:var(--bg)}.sz.lead .eyebrow{color:#55554F}
.small3 .sz{padding:12px}.small3 .sz .v{font-size:26px}
.street{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.street .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.street b{font-size:22px;font-weight:500}
.t12{height:12px;border-radius:6px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ctile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:9px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.ctile:hover{border-color:var(--dim)}
.ctop{display:flex;justify-content:space-between;gap:8px}
.trio{display:flex;gap:12px;font-size:13px;color:var(--mut);border-top:1px solid var(--line);padding-top:9px}
.trio b{color:var(--fg);font-weight:500;font-size:16px}
@media (max-width:760px){.sizes{grid-template-columns:1fr}.small3{grid-template-columns:repeat(3,minmax(0,1fr))}.hv .num{font-size:44px}}
.fblock{display:flex;flex-direction:column;gap:6px}
.chip[data-zero]{opacity:.45}
.grp{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gsum{display:flex;gap:4px;flex-wrap:wrap}
.flagt{color:var(--bad)}
.me{flex-direction:row;align-items:center;gap:6px;color:var(--mut)}
.me select{width:auto;padding:7px 8px;font-size:14px}
.upd{display:block;font-size:12px;color:var(--dim);margin-top:3px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-top:1px solid var(--line)}
.login{max-width:420px;margin:40px auto;display:flex;flex-direction:column;gap:14px}
.sz .v small{font-size:20px;color:var(--mut)}
.sz.lead .v small{color:#77776F}
.szbar{height:6px;border-radius:3px;background:var(--panel2);display:flex;overflow:hidden;margin-block:4px}
.sz.lead .szbar{background:#D9D9D3}
.szbar i{display:block;height:100%}
.sz b{color:var(--fg);font-weight:500}.sz.lead b{color:var(--bg)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:4px}
.pair>span{display:flex;flex-direction:column;gap:2px}
.pair .lbl{font-size:12px}
.pair .v{font-size:30px}
.pair>span:last-child .v{color:var(--warn)}
.sz.lead .pair>span:last-child .v{color:#B5541A}
.trio{flex-wrap:wrap;align-items:baseline}
.trio .tl{flex-basis:100%;font-family:var(--f-ui);font-size:12px}
.langs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.langs button{background:none;border:0;color:var(--mut);font:500 12px var(--f-ui);padding:7px 9px;cursor:pointer;letter-spacing:.04em}
.langs button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}
.trio2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border-top:1px solid var(--line);padding-top:10px}
.sc{display:flex;flex-direction:column;gap:1px}
.sc .k{font-size:11px;color:var(--mut);letter-spacing:.04em}
.sc .hv{font-size:15px;color:var(--fg)}
.sc .fd{font-size:20px;font-weight:500;color:var(--warn)}
.sc.done .fd{color:var(--ok);font-size:16px}
.trow{align-items:start}
.tmain{display:flex;flex-direction:column;gap:6px;min-width:0}
.tbar{height:6px;border-radius:3px;background:var(--panel2);display:flex;overflow:hidden;margin-top:2px}
.tbar i{display:block;height:100%}
.tnums{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut)}
.tnums .g{color:var(--ok)}.tnums .o{color:var(--warn)}.tnums .w{color:var(--fg);font-weight:500}
.need1{font-size:14px;color:var(--warn)}.need1 b{font-size:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:500;z-index:60}
.proto{font-size:12px;color:var(--mut);border:1px dashed var(--line);padding:8px 12px;border-radius:6px}
@media (max-width:760px){.hero,.two{grid-template-columns:1fr}.crow>summary{grid-template-columns:28px minmax(0,1fr) 84px 14px}.crow .mid{grid-column:2/4;grid-row:2}.grid2{grid-template-columns:1fr}.rules li{grid-template-columns:1fr}.bar{gap:10px}nav{order:3;flex-basis:100%}.big .v,.need .v{font-size:36px}}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>

const sizeOf=p=>p==null||p===''?null:(p<15?'S':p<100?'M':'L');
const nextSize={S:'M',M:'L'}, sizeFloor={M:15,L:100};
function calc(l){
  const sz=sizeOf(l.people),lim=sz?LIM[sz]:null,t=typeById[l.type];
  const hrs=(!t||!lim)?0:Math.min(l.hours?+l.hours:lim,lim);
  return {sz,lim,t,hrs,out:t?hrs*t.out:0,ops:hrs?Math.ceil(hrs/40):0,ok:!!(t&&lim)};
}
function compute(){
  const by={};DATA.types.forEach(t=>by[t.id]={closed:0,neg:0,n:0});
  let outC=0;
  db.locs.forEach(l=>{const c=calc(l);if(!c.ok)return;const b=by[l.type];if(!DEAD.includes(l.status))b.n++;
    if(CLOSED.includes(l.status)){b.closed+=c.hrs;outC+=c.out}else if(NEG.includes(l.status))b.neg+=c.hrs});
  const types=DATA.types.map(t=>{const b=by[t.id];const closed=Math.min(b.closed,t.plan),rem=t.plan-closed,neg=Math.min(b.neg,rem);
    return {...t,closed,neg,n:b.n,rem,need:Math.ceil(Math.max(0,rem-neg)/LIM[t.typ]),L:Math.ceil(rem/1000),M:Math.ceil(rem/100),S:Math.ceil(rem/50)}});
  const cats=DATA.cats.map(c=>{const ts=types.filter(t=>t.cat===c.id);const s=k=>ts.reduce((a,t)=>a+t[k],0);
    return {...c,ts,plan:s('plan'),closed:s('closed'),neg:s('neg'),rem:s('rem'),need:s('need'),L:s('L'),M:s('M'),S:s('S'),n:s('n'),outPlan:ts.reduce((a,t)=>a+t.plan*t.out,0)}});
  const s=k=>cats.reduce((a,c)=>a+c[k],0);
  return {types,cats,closed:s('closed'),neg:s('neg'),rem:s('rem'),need:s('need'),L:s('L'),M:s('M'),S:s('S'),outC,inC:s('closed')-outC,outPlan:s('outPlan')};
}
function growList(){
  return db.locs.map(l=>{const c=calc(l);if(!c.ok||DEAD.includes(l.status)||!nextSize[c.sz])return null;const to=nextSize[c.sz];
    return {l,c,to,need:sizeFloor[to]-l.people,gain:LIM[to]-c.lim}}).filter(Boolean).sort((a,b)=>b.gain-a.gain||a.need-b.need);
}

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;const b=$('#installBtn');if(b)b.hidden=false});
window.addEventListener('appinstalled',()=>{const b=$('#installBtn');if(b)b.hidden=true;toast('Приложение установлено')});
$('#installBtn').onclick=async()=>{if(!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;$('#installBtn').hidden=true};
setLang(LANG);
start();
</script>
</body>
</html>
